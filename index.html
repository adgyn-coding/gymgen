<html lang="fr">
<head>

        </div>   
        </div>
        
        <!-- Sélection du jour -->
        <label for="jour">Choisis un jour :</label>
        <select id="jour">
            <option value="lundi">Lundi</option>
            <option value="Mercredi">Mercredi</option>
            <option value="jeudi">Jeudi</option>
            <option value="Samedi">Samedi</option>
        </select>

        <!-- Sélection du groupe musculaire -->
        <label for="groupe">Choisis un groupe musculaire :</label>
        <select id="groupe">
            <option value="dos">Dos</option>
            <option value="biceps">Biceps</option>
            <option value="pecs">Pecs</option>
            <option value="triceps">Triceps</option>
            <option value="epaules">Épaules</option>
            <option value="abdos">Abdos</option>
            <option value="All">All</option>
        </select>

        <!-- Sélection du nombre de series et de repetitions -->
        <div class="input-flex">
            <div class="input-group">
                <label for="series">Séries :</label>
                <input type="number" id="series" min="1" max="20" value="4">
            </div>
        
            <div class="input-group">
                <label for="reps">Répétitions :</label>
                <input type="number" id="reps" min="1" max="3600" value="10">
            </div>
        <!-- Sélection du temps pour les exo type gainage et de du temps de repos -->
            <div class="input-group">
                <label for="temps">Durée (en secondes) :</label>
                <input type="number" id="temps" min="5" max="3600" value="30">
            </div>

            <div class="input-group">
                <label for="repos">Repos (en secondes) :</label>
                <input type="number" id="repos" min="5" max="600" value="30">
            </div>
            
        </div>

        <!-- Les boutons du fonctionnement de la generation et de l'export  -->
        <button id="generer">Générer les exercices</button>
        <button id="exporter">Exporter en image</button>

        <!-- Button du chronomètre -->
        <div id="chrono-container">
            <h3>Chrono</h3>
        
            <div class="chrono-config">
                <label for="chronoInput">Durée (secondes) :</label>
                <input type="number" id="chronoInput" min="5" max="3600" value="30">
            </div>
        
            <div id="chrono">00:00</div>
        
            <div class="chrono-buttons">
                <img src="media-play-svgrepo-com.svg" alt="Play/Pause" id="toggleChrono" class="chrono-btn">
                <img src="arrow-cw-svgrepo-com.svg" alt="Reset" id="resetChrono" class="chrono-btn">
            </div>
            
        </div> 
        <!--media-play-svgrepo-com.svg-->
        <!--media-pause-svgrepo-com.svg-->
        <!--arrow-cw-svgrepo-com.svg-->
        

        <!-- Affichage des exercices -->
        <div id="resultat"></div>
    </div>

    <script src="html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
